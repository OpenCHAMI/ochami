version: "2"
linters:
  # These run in addition to golangci-lint's standard linters.
  enable:
    # Keeps pkg/ free of imports from the command tree and CLI state (see
    # settings).
    - depguard
    # Forbids calls that bypass the invocation runtime (see settings).
    - forbidigo
    # Requires every //nolint directive to name its linter and give a reason,
    # and flags directives that no longer suppress anything.
    - nolintlint
    # Requires command tests to call t.Parallel() (scoped to cmd/ in the
    # exclusions).
    - paralleltest
    # Requires test helpers that take a *testing.T to call t.Helper().
    - thelper
    # Requires tests to use t.TempDir, t.Setenv, and t.Chdir rather than
    # os.MkdirTemp, os.Setenv, and os.Chdir, so the testing package cleans up.
    - usetesting
  disable:
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # pkg/ is the import-safe public API, so it must not depend on the
        # CLI's command tree, invocation state, or config formatting.
        # pkg/client may still import internal/version for its User-Agent.
        public-api:
          files:
            - "**/pkg/**/*.go"
          deny:
            - pkg: github.com/openchami/ochami/cmd
              desc: pkg/ must not depend on the command tree
            - pkg: github.com/openchami/ochami/internal/cli
              desc: pkg/ must not depend on CLI invocation state
            - pkg: github.com/openchami/ochami/internal/configfile
              desc: pkg/ must not depend on CLI config formatting
    errcheck:
      check-type-assertions: false
      check-blank: true
      exclude-functions:
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Flag values read back via Flags().GetX are always registered with
        # the matching type on the same command, so the "flag not found" /
        # "wrong type" error these return cannot occur.
        - (*github.com/spf13/pflag.FlagSet).GetBool
        - (*github.com/spf13/pflag.FlagSet).GetString
        - (*github.com/spf13/pflag.FlagSet).GetStringSlice
        - (*github.com/spf13/pflag.FlagSet).GetInt
        - (*github.com/spf13/pflag.FlagSet).GetInt32
        - (*github.com/spf13/pflag.FlagSet).GetInt32Slice
        - (*github.com/spf13/pflag.FlagSet).GetDuration
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # Match calls by the package they resolve to, so importing a package
      # under another name doesn't get past a pattern.
      analyze-types: true
      forbid:
        # Commands read and write through the invocation runtime's streams,
        # which tests replace. Applies to cmd/ only (see exclusions).
        - pattern: ^os\.(Stdin|Stdout|Stderr)$
          msg: commands use the runtime's streams (rt.Ios.In(), rt.Ios.Out(), rt.Ios.Err())
        # Same reason, for printing to os.Stdout implicitly. Library code in
        # pkg/ doesn't print either. Applies to non-test code (see
        # exclusions).
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write through the runtime's streams (rt.Ios.Out(), cli.WriteOutput)
        # Commands return errors; Execute in cmd/root.go is the one place
        # that exits, with the code cli.ExitCode assigns (see exclusions).
        - pattern: ^os\.Exit$
          msg: return an error; cmd/root.go's Execute is the only place that exits
    nolintlint:
      # Directives take the form //nolint:<linter> // <reason>.
      require-explanation: true
      require-specific: true
    paralleltest:
      # Require t.Parallel() in each command test, not in each of its t.Run
      # subtests; some tables' subtests share state.
      ignore-missing-subtests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test response writes: the client under test observes the write
      # (or its absence), so checking the httptest handler's own write
      # error adds nothing. Writes outside tests are still checked.
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value of `(w\\.Write|io\\.WriteString)` is not checked"
      # Only command tests are required to call t.Parallel(); elsewhere, many
      # tests share package state.
      - path-except: ^cmd/
        linters:
          - paralleltest
      # Outside cmd/, the runtime itself (internal/cli) and library defaults
      # (pkg/client's ReadPayload helpers) use the process's streams.
      - path-except: ^cmd/
        linters:
          - forbidigo
        text: "os\\.(Stdin|Stdout|Stderr)"
      # Tests and examples print freely; examples must, for their Output
      # comments.
      - path: _test\.go
        linters:
          - forbidigo
        text: "fmt\\.Print"
      # Execute in cmd/root.go is where a command's exit code takes effect.
      - path: ^cmd/root\.go$
        linters:
          - forbidigo
        text: "os\\.Exit"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # A list of prefixes, which, if set, checks import paths
      # with the given prefixes are grouped after 3rd-party packages.
      # Default: []
      local-prefixes:
        - github.com/openchami/ochami/
  exclusions:
    generated: lax
