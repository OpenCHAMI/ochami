version: "2"
linters:
  enable: []
  disable:
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test response writes: the client under test observes the write
      # (or its absence), so checking the httptest handler's own write
      # error adds nothing. Writes outside tests are still checked.
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value of `(w\\.Write|io\\.WriteString)` is not checked"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # A list of prefixes, which, if set, checks import paths
      # with the given prefixes are grouped after 3rd-party packages.
      # Default: []
      local-prefixes:
        - github.com/openchami/ochami/
  exclusions:
    generated: lax
