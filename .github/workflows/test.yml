name: test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  jinja-reference:
    name: Python Jinja2 reference
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.15.0'

      - name: Install pinned reference dependencies
        run: python -m pip install -r scripts/jinja-reference-requirements.txt

      - name: Verify exact Python output
        run: python scripts/jinja-reference.py

  test:
    name: test
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run Go unit tests (race detector, parallel)
        run: make test PARALLEL=4
