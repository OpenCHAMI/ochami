name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Run Go unit tests
        run: make test
