name: reuse
on: [push, pull_request]

permissions:
  contents: read

jobs:
  reuse:
    name: reuse
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: REUSE Compliance Check
        run: pipx run --backend pip --spec reuse==6.2.0 reuse lint --lines
