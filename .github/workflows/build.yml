name: Build
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to build (optional, for manual PR builds)'
        required: false
        type: string

permissions:
  contents: write # For creating temporary local Git tags
  packages: write # For pushing PR container

jobs:
  build-goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Install scdoc for man page generation
        run: |
          sudo apt update
          sudo apt install scdoc

      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Create Tag for PR
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          PR_NUM="${{ github.event.number }}"
          if [[ "${{ inputs.pr_number }}" != "" ]]; then
            PR_NUM="${{ inputs.pr_number }}"
          fi
          git tag -f -a v0.0.0-pr-${PR_NUM} -m "pr-${PR_NUM} Build"

      - name: Set build environment variables
        run: |
          echo "GOVERSION=$(go env GOVERSION)" >> $GITHUB_ENV
          echo "BUILD_HOST=$(hostname)" >> $GITHUB_ENV
          echo "BUILD_USER=$(whoami)" >> $GITHUB_ENV
          echo "IS_PR_BUILD=true" >> $GITHUB_ENV
          if [[ "${{ inputs.pr_number }}" != "" ]]; then
            echo "DOCKER_TAG=pr-${{ inputs.pr_number }}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=pr-${{ github.event.number }}" >> $GITHUB_ENV
          fi

      - name: Check if fork PR
        id: fork_check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "SKIP_CONTAINER_PUBLISH=true" >> $GITHUB_ENV
            echo "::warning title=Fork PR - Container Publish Skipped::Containers will be built but not published for fork PRs due to GitHub security restrictions. See CONTRIBUTING.md for details."
          else
            echo "SKIP_CONTAINER_PUBLISH=false" >> $GITHUB_ENV
          fi

      - name: Build with goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip announce,validate,aur${{ env.SKIP_CONTAINER_PUBLISH == 'true' && ',publish' || '' }}
        id: goreleaser

  build-make-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y make git

      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Build manual pages
        run: |
          make

  build-make-container-multistage:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y make git

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Build container from source using multi-stage build
        run: |
          make container

  docs-make:
    runs-on: ubuntu-latest
    steps:

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y make git scdoc

      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Build manual pages
        run: |
          make man
