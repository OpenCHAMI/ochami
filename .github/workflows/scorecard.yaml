name: scorecard

on:
  branch_protection_rule:
  pull_request:
  schedule:
    - cron: '39 5 * * 1'
  push:
    branches:
      - main

permissions: read-all

jobs:
  scorecard:
    name: scorecard
    # Scorecard runs as a container action, which is unavailable on the
    # unprivileged ubuntu-slim runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
